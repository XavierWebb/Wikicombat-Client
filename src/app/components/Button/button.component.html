<button class="
                px-5 py-2 mx-2 rounded-xl font-[950] 
                text-[1rem] text-center cursor-pointer
                text-black transition duration-250
            " 
        (click)="handleClick()"
        [ngClass]="{
            'bg-[#FBAE1D] hover:bg-[#fbcf1d]': variant == 'primary',
            'hover:text-[#505050]': variant == 'secondary'
        }"
    >
    {{ text }}
</button>
